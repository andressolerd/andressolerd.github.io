<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Contacto - Andrés Soler</title>
  <style>
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      background-color: #f4f6f8;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      margin: 0;
      padding: 20px;
      box-sizing: border-box;
    }
    .card {
      background: #ffffff;
      padding: 32px 24px;
      border-radius: 20px;
      box-shadow: 0 4px 20px rgba(0, 0, 0, 0.08);
      text-align: center;
      max-width: 380px;
      width: 100%;
    }
    h1 { margin-top: 0; color: #1a1a1a; font-size: 24px; font-weight: 700; }
    p { color: #555555; font-size: 15px; line-height: 1.5; margin-bottom: 25px; }
    .btn-whatsapp {
      display: block;
      background-color: #25D366;
      color: #ffffff;
      text-decoration: none;
      font-weight: bold;
      font-size: 17px;
      padding: 16px 20px;
      border-radius: 50px;
      box-shadow: 0 4px 12px rgba(37, 211, 102, 0.35);
    }
    .aviso { margin-top: 20px; font-size: 12px; color: #888; }
  </style>
</head>
<body>

  <div class="card">
    <h1>Andrés Soler</h1>
    <p>¡Hola! Haz clic aquí para chatear conmigo en WhatsApp.</p>
    
    <!-- Se añade target="_top" para intentar salir del frame de TikTok -->
    <a href="https://wa.me/573025974133" class="btn-whatsapp" target="_top">
      Contactar por WhatsApp
    </a>
    
    <p class="aviso">Si el botón no abre WhatsApp, toca los tres puntos (⋮) en la esquina superior derecha y selecciona "Abrir en el navegador".</p>
  </div>

</body>
</html>
